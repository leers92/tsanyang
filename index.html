<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안양자동차검사소 하체사진 조회</title>
<style>
body{margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#17243b}
header{background:#1255a2;color:white;padding:26px 16px;text-align:center}
header h1{font-size:23px;margin:10px 0}
main{background:white;margin:30px 16px;padding:28px 20px;border-radius:16px;box-shadow:0 4px 18px #0001}
h2{text-align:center;font-size:21px}
p{text-align:center;color:#667085;font-size:14px;line-height:1.6}
input{box-sizing:border-box;width:100%;padding:16px;border:1px solid #cbd5e1;border-radius:9px;font-size:18px;margin-top:20px}
button{width:100%;padding:16px;margin-top:14px;background:#1255a2;color:white;border:0;border-radius:9px;font-size:17px;font-weight:bold}
#result{margin-top:20px;text-align:center}
footer{text-align:center;font-size:12px;color:#667085;margin:30px 10px}
</style>
</head>
<body>
<header>
<div>TS 한국교통안전공단</div>
<h1>안양자동차검사소</h1>
<div>자동차 하체사진 조회 서비스</div>
</header>
<main>
<h2>내 차량 하체사진 조회</h2>
<p>검사 차량번호를 입력하면<br>등록된 하체사진을 확인할 수 있습니다.</p>
<input id="car" placeholder="차량번호 입력" autocomplete="off">
<button onclick="searchPhoto()">하체사진 조회하기</button>
<div id="result"></div>
</main>
<footer>시연용 서비스 · 실제 차량정보는 등록하지 마세요.</footer>
<script>
function searchPhoto(){
 const car=document.getElementById('car').value.trim();
 const result=document.getElementById('result');
 if(!car){result.textContent='차량번호를 입력해 주세요.';return;}
 result.textContent='조회 기능은 다음 단계에서 연결됩니다.';
}
</script>
</body>
</html>
