<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TS 안양자동차검사소 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;font-family:Arial,sans-serif;color:#243247}
header{background:#1255a2;color:white;padding:24px 16px;text-align:center}
header h1{font-size:21px;margin:0 0 8px}
header p{margin:0;font-size:13px}
main{max-width:520px;margin:24px auto;padding:0 16px}
section{background:white;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 14px #0000000a}
h2{font-size:19px;margin-top:0}
label{display:block;font-weight:bold;margin:16px 0 7px}
input{width:100%;padding:14px;border:1px solid #ccd5e0;border-radius:9px;font-size:16px}
button{width:100%;padding:15px;background:#1255a2;color:white;border:0;border-radius:9px;font-size:16px;font-weight:bold;margin-top:17px;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#64748b}
.hidden{display:none}
#status{white-space:pre-wrap;line-height:1.6;font-size:14px;overflow-wrap:anywhere}
small{color:#667085}
</style>
</head>
<body>
<header>
<h1>TS 한국교통안전공단</h1>
<p>안양자동차검사소 | 하체사진 관리자</p>
</header>
<main>
<section id="loginBox">
<h2>관리자 로그인</h2>
<label for="email">이메일</label>
<input id="email" type="email" autocomplete="username">
<label for="password">비밀번호</label>
<input id="password" type="password" autocomplete="current-password">
<button id="loginBtn">로그인</button>
</section>

<section id="uploadBox" class="hidden">
<h2>하체사진 업로드</h2>
<small>차량당 사진 1~7장 선택</small>
<label for="plate">차량번호</label>
<input id="plate" placeholder="12가3456">
<label for="photos">하체사진 선택 (최대 7장)</label>
<input id="photos" type="file" accept="image/*" multiple>
<button id="uploadBtn">사진 업로드</button>
<button id="logoutBtn" class="secondary">로그아웃</button>
</section>

<section>
<h2>작업 상태</h2>
<div id="status">연결 확인 중...</div>
</section>
</main>

<script>
const SUPABASE_URL =
  "https://qxilydmnxkhcxdybzlew.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_dgOcMAwzSnNozCaHlD6qHg_hXsnNO_t";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);
const status = msg => $("status").textContent = msg;

async function refresh() {
  const {data:{user},error:userError} =
    await db.auth.getUser();

  if (userError || !user) {
    $("loginBox").classList.remove("hidden");
    $("uploadBox").classList.add("hidden");
    status("관리자 로그인이 필요합니다.");
    return;
  }

  const {data,error} = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if (error || !data) {
    $("loginBox").classList.remove("hidden");
    $("uploadBox").classList.add("hidden");
    status("관리자 권한을 확인할 수 없습니다.");
    return;
  }

  $("loginBox").classList.add("hidden");
  $("uploadBox").classList.remove("hidden");
  status("관리자 로그인 완료. 사진을 업로드할 수 있습니다.");
}

$("loginBtn").onclick = async () => {
  $("loginBtn").disabled = true;
  try {
    const {error} = await db.auth.signInWithPassword({
      email:$("email").value.trim(),
      password:$("password").value
    });
    if (error) throw error;
    $("password").value = "";
    await refresh();
  } catch(e) {
    status("로그인 실패: " + e.message);
  } finally {
    $("loginBtn").disabled = false;
  }
};

$("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  await refresh();
};

$("uploadBtn").onclick = async () => {
  const plate = $("plate").value.trim().replace(/\s/g,"");
  const files = Array.from($("photos").files);

  if (!/^\d{2,3}[가-힣]\d{4}$/.test(plate)) {
    status("차량번호를 확인해 주세요.");
    return;
  }

  if (files.length < 1 || files.length > 7) {
    status("사진은 1~7장을 선택해 주세요.");
    return;
  }

  if (files.some(f => !f.type.startsWith("image/"))) {
    status("이미지 파일만 업로드할 수 있습니다.");
    return;
  }

  $("uploadBtn").disabled = true;

  try {
    const {data:{user},error:authError} =
      await db.auth.getUser();

    if (authError || !user) {
      throw new Error("다시 로그인해 주세요.");
    }

    const {data:admin,error:adminError} = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id",user.id)
      .maybeSingle();

    if (adminError || !admin) {
      throw new Error("관리자 권한이 없습니다.");
    }

    status("차량정보 등록 중...");

    const {data:vehicle,error:vehicleError} = await db
      .from("vehicles")
      .insert({plate_number:plate})
      .select("id")
      .single();

    if (vehicleError) throw vehicleError;

    for (let i=0;i<files.length;i++) {
      status(`사진 업로드 중... ${i+1}/${files.length}`);

      const file = files[i];
      const ext = file.name.split(".").pop()
        .toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";

      const path =
        `${vehicle.id}/${i+1}-${crypto.randomUUID()}.${ext}`;

      const {error:storageError} = await db.storage
        .from("underbody-photos")
        .upload(path,file,{
          contentType:file.type,
          upsert:false
        });

      if (storageError) throw storageError;

      const {error:photoError} = await db
        .from("vehicle_photos")
        .insert({
          vehicle_id:vehicle.id,
          storage_path:path,
          photo_order:i+1
        });

      if (photoError) throw photoError;
    }

    status(
      `업로드 성공!\n차량번호: ${plate}\n사진: ${files.length}장`
    );

    $("plate").value = "";
    $("photos").value = "";

  } catch(e) {
    status(
      "업로드 중 오류: " + e.message +
      "\n일부 파일이 저장됐을 수 있습니다. " +
      "같은 차량을 바로 다시 등록하지 마세요."
    );
  } finally {
    $("uploadBtn").disabled = false;
  }
};

refresh().catch(e => {
  status("연결 오류: " + e.message);
});
</script>
</body>
</html>
